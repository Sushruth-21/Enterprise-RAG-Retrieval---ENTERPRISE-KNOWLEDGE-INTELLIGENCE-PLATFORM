version: "3.9"

services:
  # ── Person 1's FastAPI Backend ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override these with actual service IPs during integration
      - RETRIEVAL_API_URL=http://retrieval:8002   # Person 3's service
      - INGESTION_API_URL=http://ingestion:8003   # Person 2's service
      - MCP_SERVER_URL=http://mcp:8001            # Person 4's service
      - OLLAMA_BASE_URL=http://host.docker.internal:11434  # Ollama on host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Person 3 owns PostgreSQL + pgvector ────────────────────
